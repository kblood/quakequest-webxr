<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 512 512">
  <!-- Maskable variant of icon.svg: background must be edge-to-edge opaque
       (the OS applies its own crop shape) and the glyph must stay inside the
       safe-zone circle (centered, 80% of the canvas -> radius 204.8 here).
       Source of truth for icon-512-maskable.png; see tools/gen-icons.mjs. -->
  <defs>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9603a"/>
      <stop offset="0.55" stop-color="#a8452a"/>
      <stop offset="1" stop-color="#7a2b16"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#111111"/>
  <circle cx="256" cy="256" r="204" fill="#7a2b16" opacity="0.18"/>
  <text x="256" y="336" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="260"
        fill="url(#bronze)" stroke="#2a0e06" stroke-width="5" paint-order="stroke fill">Q</text>
</svg>
