<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 512 512">
  <!-- QuakeQuest Web app icon (source of truth for icon-192.png / icon-512.png).
       Dark page background (#111) + the bronze accent pair the page's own
       buttons use (#7a2b16 fill / #a8452a border). Rendered to PNG sizes by
       tools/gen-icons.mjs — do not hand-edit the PNGs, edit this SVG. -->
  <defs>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9603a"/>
      <stop offset="0.55" stop-color="#a8452a"/>
      <stop offset="1" stop-color="#7a2b16"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#111111"/>
  <circle cx="256" cy="256" r="216" fill="#7a2b16" opacity="0.16"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#a8452a" stroke-width="6" opacity="0.5"/>
  <text x="256" y="366" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="360"
        fill="url(#bronze)" stroke="#2a0e06" stroke-width="6" paint-order="stroke fill">Q</text>
</svg>
